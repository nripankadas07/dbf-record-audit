[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dbf-record-audit"
version = "0.1.0"
description = "Audit dBASE III binary table structure and active/deleted cell quality without coercing numeric data."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
[project.scripts]
dbf-record-audit = "dbf_record_audit:main"
[tool.setuptools]
py-modules = ["dbf_record_audit"]
